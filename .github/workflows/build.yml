name: Build Résumé PDF

on:
  push:
    branches: [main]
    paths: ['resume.md', 'build-resume.py', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python build-resume.py resume.md resume.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume.pdf
