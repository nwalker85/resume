name: Build Résumé PDF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm designed résumé
        run: |
          test -f resume.html
          test -f resume.md
          test -s resume.pdf
          python3 - <<'PY'
          from pathlib import Path
          p = Path('resume.pdf')
          data = p.read_bytes()
          assert data.startswith(b'%PDF'), 'resume.pdf is not a PDF'
          assert p.stat().st_size > 50_000, f'resume.pdf too small ({p.stat().st_size}); refusing a ReportLab stub'
          print(f'resume.pdf ok ({p.stat().st_size} bytes)')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume.pdf
